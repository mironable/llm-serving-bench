[project]
name = "llm-serving-bench"
version = "0.1.0"
description = "vLLM vs SGLang on Modal: time to first token, inter-token latency and throughput under load"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6,<2",
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["bench", "serve", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
